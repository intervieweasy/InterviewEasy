services:
  postgres:
    image: postgres:17
    container_name: intervieweasy-postgres
    environment:
      POSTGRES_USER: intervieweasy
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: intervieweasy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervieweasy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: